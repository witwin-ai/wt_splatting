id = "witwin.splatting"
name = "WiTwin Splatting"
version = "0.1.0"
description = "First-party Gaussian Splatting renderers and data loaders."
repository = "https://github.com/witwin-ai/wt_splatting"
enabled = true

[engines]
witwin = "^1.0.0"

[web]
root = "web"

[contributes.viewport.host]
entry = "viewport.js"
sdkVersion = "1.0.0"

[[contributes.solvers]]
id = "witwin.splatting.reconstruct_3dgs"
title = "3DGS Reconstruction"
entry = "solver_host.py"
lifecycle = "cold"
maxParallel = 1

[contributes.solvers.runtime]
python = "${backend:python}"

[contributes.solvers.capabilities]
cancel = true
partials = true

[permissions]
frontend = true
shader = true
